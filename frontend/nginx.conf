server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500M;

    # Docker'ning ichki DNS'i. Usiz nginx upstream IP'sini faqat ishga
    # tushganda bir marta hal qiladi: `docker compose up -d --build backend`
    # dan keyin bekend yangi IP oladi, nginx esa eskisiga yuboraveradi — va
    # o'sha IP boshqa konteynerga o'tib ketgan bo'lsa, so'rovlar begona
    # servisga tushadi. Aynan shu sabab login sahifasi «Xatolik yuz berdi»
    # deb turgan edi: /api/ so'rovlari face-detection'ga borib 404 olardi.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /dev/stdout combined;
    access_log /var/log/app_frontend/access.log combined;
    error_log /dev/stderr warn;
    error_log /var/log/app_frontend/error.log warn;

    # Backend REST API
    location /api/ {
        # O'zgaruvchi orqali — shunda nginx manzilni har so'rovda qayta
        # hal qiladi, bir marta emas.
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # HEMIS va EduPlan sinxronizatsiyasi. Bitta so'rov ichida 49 sahifa
    # o'qiladi va minglab yozuv yoziladi — umumiy /api/ dagi 60 soniya bunga
    # yetmaydi va admin 504 ko'rardi, holbuki import fonda davom etardi.
    # Faqat shu og'ir yo'llarga uzun timeout: qolgan API tez javob berishi
    # kerak va uni kutib o'tirishning ma'nosi yo'q.
    location ~ ^/api/(hemis|integration/eduplan)/ {
        set $sync_upstream backend;
        proxy_pass http://$sync_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Static uploads served by the backend
    location /uploads/ {
        set $uploads_upstream backend;
        proxy_pass http://$uploads_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Face-detection WebSocket (quiz proctoring)
    location /v1/video/stream {
        set $face_upstream face-detection;
        proxy_pass http://$face_upstream:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Документация API (Swagger / ReDoc) — проксируется на backend, чтобы быть
    # доступной через домен: /docs, /redoc, /openapi.json
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Хэшированные ассеты Vite: имя файла меняется при каждом изменении
    # содержимого, поэтому их можно кэшировать бессрочно.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируется без ревалидации: иначе после деплоя браузеры
    # держат старую оболочку со ссылками на старые ассеты, и пользователи
    # видят старый интерфейс до жёсткого обновления.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
