server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Выше лимита приложения (150 МБ на видео): nginx меряет весь multipart, а
    # его 413 приходит HTML-ом без CORS — клиент не может его прочитать и
    # показывает непереводимое «HTTP 413». Пусть отказ приходит из FastAPI.
    client_max_body_size 200M;

    access_log /dev/stdout combined;
    access_log /var/log/app_frontend/access.log combined;
    error_log /dev/stderr warn;
    error_log /var/log/app_frontend/error.log warn;

    # Backend REST API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static uploads served by the backend
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Face-detection WebSocket (quiz proctoring)
    location /v1/video/stream {
        proxy_pass http://face-detection:8000/v1/video/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
