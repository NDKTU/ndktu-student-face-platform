server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    access_log /dev/stdout combined;
    access_log /var/log/app_frontend/access.log combined;
    error_log /dev/stderr warn;
    error_log /var/log/app_frontend/error.log warn;

    # Backend REST API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static uploads served by the backend
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Face-detection WebSocket (quiz proctoring)
    location /v1/video/stream {
        proxy_pass http://face-detection:8000/v1/video/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Eski SPA o'tish davrida shu yerda yashaydi. U faqat statika beradi:
    # uning /api chaqiruvlari brauzer origin'i orqali yuqoridagi /api/ blokiga
    # tushadi, shuning uchun legacy konteynerida proxy kerak emas.
    # 4-bosqichda bu blok butunlay o'chiriladi.
    location /legacy/ {
        proxy_pass http://frontend-legacy:3000/legacy/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
