[project]
name = "nusmt-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.2",
    "asyncpg>=0.31.0",
    "bcrypt<4.0",
    "cryptography>=50.0.0",
    "fastapi-limiter>=0.1.6",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "passlib>=1.7.4",
    "pyjwt>=2.10.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "redis>=7.1.0",
    "sqlalchemy>=2.0.46",
    "xlrd>=2.0.1",
]

[tool.pytest.ini_options]
# Faqat backend ildizi: `app/` ni ham qo'shish `core.*` ni ikkinchi nom bilan
# import qilinadigan qilardi — bitta modul ikki marta yuklanardi
# (`settings`, `redis_client` ikkitadan). Hamma import `app.` dan boshlanadi.
pythonpath = [
  "."
]
# Один event loop на весь прогон, как в продакшне: и SQLAlchemy-движок, и Redis-клиент
# создаются на уровне модуля при импорте, а их пулы привязываются к тому loop, который
# первым ими воспользовался. С loop-scope "function" любой второй тест, дошедший до
# Redis или до общего движка, падал с «Event loop is closed».
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::sqlalchemy.exc.SAWarning"
]



[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# E/W = pycodestyle, F = Pyflakes, I = isort (import sorting),
# TID251 = taqiqlangan importlar (pastda),
# PLC0415 = funksiya ichidagi import: u modulning bog'liqliklarini yashiradi
# va import siklini «yamaydi». Asosli istisno — `# noqa: PLC0415 — sabab`.
select = ["E", "W", "F", "I", "TID251", "PLC0415"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Bitta ildiz — `app.`. `core.*` va `main` — o'sha modullarning ikkinchi nomi:
# Python ularni alohida yuklaydi (ikki `settings`, ikki `redis_client`).
"core".msg = "`app.core` dan import qiling — `core.*` shu modulning ikkinchi nomi"
"main".msg = "`app.main` dan import qiling"

[tool.ruff.lint.per-file-ignores]
# Tests often contain long URLs, payloads, fixtures — line length is not useful here.
"app/test/*" = ["E501", "PLC0415"]
# Migratsiyalar o'z vaqtidagi holatni import qiladi — yuqoriga ko'tarish ma'nosiz.
"app/migrations/*" = ["PLC0415"]
# init_db.py contains long SQL string literals; will be rewritten in upcoming RBAC simplification.
"app/core/init_db.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
