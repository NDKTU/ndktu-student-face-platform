# O'tish davridagi eski SPA. Faqat statika beradi: /api, /uploads va
# /v1/video/stream chaqiruvlari brauzer origin'i orqali asosiy frontend
# nginx'iga tushadi, shuning uchun bu yerda proxy bloklari kerak emas.
# 4-bosqichda butun katalog bilan birga o'chiriladi.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    # Vite `base: '/legacy/'` bilan build qilingan, statika ham shu kichik
    # katalogda yotadi — SPA fallback ham /legacy/index.html ga boradi.
    location /legacy/ {
        try_files $uri $uri/ /legacy/index.html;
    }

    # Prefiksiz kirilsa SPA o'z bazasiga qaytariladi.
    location = / {
        return 302 /legacy/;
    }
}
